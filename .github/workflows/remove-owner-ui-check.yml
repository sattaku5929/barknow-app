name: Remove owner UI check

on:
  push:
    branches:
      - chore/remove-owner-unused-ui

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Insight tests
        run: npm run test:insights
      - name: Observation tests
        run: npm run test:observations
      - name: Build
        run: npm run build
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
