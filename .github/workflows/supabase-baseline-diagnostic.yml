name: supabase-baseline-diagnostic

on:
  push:
    branches:
      - chore/supabase-migration-baseline

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase CLI version and help
        run: |
          npx -y supabase@latest --version
          npx -y supabase@latest --help
          npx -y supabase@latest migration --help
          npx -y supabase@latest migration new --help
          npx -y supabase@latest migration repair --help
          npx -y supabase@latest migration list --help
          npx -y supabase@latest migration squash --help
          npx -y supabase@latest db dump --help
          npx -y supabase@latest db push --help
          npx -y supabase@latest db reset --help
          npx -y supabase@latest start --help
      - name: Fresh 001-035 rebuild attempt
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx -y supabase@latest init
          fi
          npx -y supabase@latest start
          npx -y supabase@latest db reset
      - name: Canonical local schema hashes
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -At <<'SQL'
          with app_columns as (
            select table_schema,table_name,column_name,ordinal_position,data_type,udt_schema,udt_name,is_nullable,
                   coalesce(column_default,''),is_identity,coalesce(identity_generation,''),is_generated,coalesce(generation_expression,'')
            from information_schema.columns where table_schema='public'
          ),
          app_constraints as (
            select n.nspname,c.relname,con.conname,con.contype,pg_get_constraintdef(con.oid,true) def
            from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public'
          ),
          app_indexes as (
            select schemaname,tablename,indexname,indexdef from pg_indexes where schemaname='public'
          ),
          app_functions as (
            select n.nspname,p.proname,pg_get_function_identity_arguments(p.oid) args,pg_get_function_result(p.oid) result,
                   l.lanname,r.rolname,p.prosecdef,coalesce(array_to_string(p.proconfig,','),'') config,
                   pg_get_functiondef(p.oid) def,coalesce(obj_description(p.oid,'pg_proc'),'') comment
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace join pg_language l on l.oid=p.prolang join pg_roles r on r.oid=p.proowner
            where n.nspname='public'
          ),
          app_triggers as (
            select n.nspname,c.relname,t.tgname,pg_get_triggerdef(t.oid,true) def
            from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
            where not t.tgisinternal and n.nspname in ('public','auth')
          ),
          app_policies as (
            select n.nspname,c.relname,p.polname,p.polcmd,p.polpermissive,
                   array_to_string(array(select r.rolname from unnest(p.polroles) x(oid) join pg_roles r on r.oid=x.oid order by r.rolname),',') roles,
                   coalesce(pg_get_expr(p.polqual,p.polrelid),''),coalesce(pg_get_expr(p.polwithcheck,p.polrelid),'')
            from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','storage')
          ),
          table_security as (
            select n.nspname,c.relname,c.relkind,c.relrowsecurity,c.relforcerowsecurity,coalesce(obj_description(c.oid,'pg_class'),'') comment
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind in ('r','p','v','m','S')
          ),
          grants as (
            select table_schema,table_name,grantee,privilege_type,is_grantable
            from information_schema.role_table_grants where table_schema='public'
          ),
          buckets as (
            select id,name,public,file_size_limit,coalesce(array_to_string(allowed_mime_types,','),'') allowed_mime_types from storage.buckets
          ),
          pubrels as (
            select p.pubname,n.nspname,c.relname
            from pg_publication p left join pg_publication_rel pr on pr.prpubid=p.oid left join pg_class c on c.oid=pr.prrelid left join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public'
          )
          select * from (
          select 'columns' category,count(*) n,md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by table_schema,table_name,ordinal_position),'')) hash from app_columns x
          union all select 'constraints',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by nspname,relname,conname),'')) from app_constraints x
          union all select 'indexes',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by schemaname,tablename,indexname),'')) from app_indexes x
          union all select 'functions',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by nspname,proname,args),'')) from app_functions x
          union all select 'triggers',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by nspname,relname,tgname),'')) from app_triggers x
          union all select 'policies',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by nspname,relname,polname),'')) from app_policies x
          union all select 'table_security',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by nspname,relname),'')) from table_security x
          union all select 'grants',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by table_schema,table_name,grantee,privilege_type),'')) from grants x
          union all select 'buckets',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by id),'')) from buckets x
          union all select 'publications',count(*),md5(coalesce(string_agg(row_to_json(x)::text,E'\n' order by pubname,nspname,relname),'')) from pubrels x
          ) s order by category;
          SQL
      - name: Managed schema object fingerprints
        run: |
          echo '--- GENERATED CONFIG ---'
          cat supabase/config.toml
          echo '--- MIGRATION NEW PROBE ---'
          npx -y supabase@latest migration new baseline_probe
          ls -1 supabase/migrations/*baseline_probe.sql
          rm supabase/migrations/*baseline_probe.sql
          echo '--- OBJECT FINGERPRINTS ---'
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -At <<'SQL'
          select 'COL|'||table_name||'.'||column_name||'|'||
            md5(row_to_json(x)::text)
          from (
            select table_name,column_name,ordinal_position,data_type,udt_schema,udt_name,is_nullable,
                   coalesce(column_default,'') column_default,is_identity,coalesce(identity_generation,'') identity_generation,
                   is_generated,coalesce(generation_expression,'') generation_expression
            from information_schema.columns
            where table_schema='public' and (table_name like 'wt\_%' escape '\' or table_name='push_subscriptions')
          ) x order by table_name,ordinal_position;

          select 'CON|'||c.relname||'.'||con.conname||'|'||
            md5(con.contype::text||'|'||pg_get_constraintdef(con.oid,true))
          from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
          where n.nspname='public' and (c.relname like 'wt\_%' escape '\' or c.relname='push_subscriptions')
          order by c.relname,con.conname;

          select 'IDX|'||tablename||'.'||indexname||'|'||md5(indexdef)
          from pg_indexes
          where schemaname='public' and (tablename like 'wt\_%' escape '\' or tablename='push_subscriptions')
          order by tablename,indexname;

          select 'FUN|'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')|'||
             md5(pg_get_function_result(p.oid)||'|'||l.lanname||'|'||r.rolname||'|'||p.prosecdef::text||'|'||
                 coalesce(array_to_string(p.proconfig,','),'')||'|'||pg_get_functiondef(p.oid)||'|'||
                 coalesce(obj_description(p.oid,'pg_proc'),''))
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace join pg_language l on l.oid=p.prolang join pg_roles r on r.oid=p.proowner
          where n.nspname='public' and p.proname like 'wt\_%' escape '\'
          order by p.proname,pg_get_function_identity_arguments(p.oid);

          select 'POL|'||n.nspname||'.'||c.relname||'.'||p.polname||'|'||
            md5(p.polcmd::text||'|'||p.polpermissive::text||'|'||
                coalesce(array_to_string(array(select rr.rolname from unnest(p.polroles) x(oid) join pg_roles rr on rr.oid=x.oid order by rr.rolname),','),'')||'|'||
                coalesce(pg_get_expr(p.polqual,p.polrelid),'')||'|'||coalesce(pg_get_expr(p.polwithcheck,p.polrelid),''))
          from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace
          where (n.nspname='public' and (c.relname like 'wt\_%' escape '\' or c.relname='push_subscriptions'))
             or (n.nspname='storage' and c.relname='objects' and (p.polname ilike '%avatar%' or p.polname ilike '%dog%' or p.polname ilike '%coach%'))
          order by n.nspname,c.relname,p.polname;
          SQL
