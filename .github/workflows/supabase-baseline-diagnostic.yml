name: materialize-supabase-baseline

on:
  push:
    branches:
      - chore/supabase-migration-baseline

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.event.head_commit.message != 'chore: materialize validated Supabase baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: final-production-baseline-candidate
          path: /tmp/candidate
          github-token: ${{ github.token }}
          run-id: 37181215534

      - name: Copy validated files
        run: |
          rm -rf supabase
          cp -R /tmp/candidate/supabase ./supabase
          sed -i '0,/port = 55432/s//port = 54322/' supabase/config.toml
          cp /tmp/candidate/tests/observationTrends.sql.test.mjs tests/observationTrends.sql.test.mjs
          cp /tmp/candidate/tests/observationEventIntensity.sql.test.mjs tests/observationEventIntensity.sql.test.mjs
          cp /tmp/candidate/tests/observationSoftDelete.sql.test.mjs tests/observationSoftDelete.sql.test.mjs
          cp /tmp/candidate/tests/observationSoftDeleteAlignment.sql.test.mjs tests/observationSoftDeleteAlignment.sql.test.mjs
          rm -f baseline-semantic-fingerprints.txt
          rm -f .github/workflows/supabase-baseline-diagnostic.yml

      - name: Commit validated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: materialize validated Supabase baseline"
          git push origin HEAD:chore/supabase-migration-baseline
