name: observation-alignment-diagnostic

on:
  push:
    branches:
      - fix/observation-soft-delete-alignment

jobs:
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/observationSoftDeleteAlignment.sql.test.mjs
