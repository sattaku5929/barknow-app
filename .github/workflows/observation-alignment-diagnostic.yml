name: observation-alignment-diagnostic

on:
  push:
    branches:
      - fix/observation-soft-delete-alignment

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run old-state alignment case
        run: timeout 60s node --test --test-name-pattern='A full old' tests/observationSoftDeleteAlignment.sql.test.mjs
