name: observation-alignment-diagnostic

on:
  push:
    branches:
      - fix/observation-soft-delete-alignment

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:insights
      - run: npm run test:observations
      - run: npm run build
